# ─────────────────────────────────────────────────────────────────────────────
# 对象：DNS 供应商（模型规范 · 索引）
# 一个供应商一个文件：docs/v4.1/model/dns-provider/<id>.yaml
# 规则来源：acme.sh dnsapi（https://github.com/acmesh-official/acme.sh/wiki/dnsapi）
# 归属：设置 → DNS 供应商
#
# 每个供应商文件包含：
#   kind: dns-provider · id · label · group · acmeHook · docs
#   enabled：显示开关（布尔，默认 false）—— 选中才在「域名 → 凭证 → 添加凭证」出现
#   fields[]：凭证字段模型（key/label/type/required/secret/env[→acme.sh 环境变量]/advanced/note）
#   status[]：自动记录（只读）
# ─────────────────────────────────────────────────────────────────────────────

kind: dns-provider-index              # 索引文件（非供应商实例）
title: DNS 供应商                      # 显示名
group: 设置                            # 归属一级页面

# 内置（GateBox 自带 4 个）
builtin:
  - { id: cloudflare, label: Cloudflare,         acmeHook: dns_cf,      enabled: true }    # Cloudflare（默认勾选）
  - { id: tencent,    label: 腾讯云（DNSPod）,    acmeHook: dns_tencent, enabled: true }    # 腾讯云 DNSPod（默认勾选）
  - { id: dnspod-cn,  label: DNSPod（dnspod.cn）, acmeHook: dns_dp,      enabled: true }    # dnspod.cn 国内站（默认勾选）
  - { id: aliyun,     label: 阿里云（Aliyun）,    acmeHook: dns_ali,     enabled: true }    # 阿里云（默认勾选）

# 远程库：其余 100+ 供应商模型放 GitHub，由系统按序拉取；界面「新增 DNS 供应商」从库中选取导入。
# 每个供应商一个 yaml，模型与内置同构（hook + fields[env]），导入后可在列表勾选「显示」。
remote:
  source: github
  repo: gatebox-store/dns-providers   # 模型库仓库
  index: index.yaml                    # 索引（可签名，复用插件索引的 Ed25519）
  note: route53(dns_aws) / digitalocean(dns_dgon) / gandi / godaddy(dns_gd) / duckdns(dns_duckdns) …
