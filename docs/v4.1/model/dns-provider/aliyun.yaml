# ─────────────────────────────────────────────────────────────────────────────
# DNS 供应商 · 阿里云（Aliyun）
# 规则来源：acme.sh dnsapi（hook dns_ali）
# ─────────────────────────────────────────────────────────────────────────────

kind: dns-provider                    # 对象类型标识
id: aliyun                            # 供应商标识
label: 阿里云（Aliyun）                # 显示名
group: 设置                            # 归属：设置 → DNS 供应商
acmeHook: dns_ali                     # acme.sh hook
docs: https://github.com/acmesh-official/acme.sh/wiki/dnsapi#11-use-aliyun-domain-api-to-automatically-issue-cert
enabled: true                         # 显示开关：默认勾选

fields:                               # 凭证字段模型
  - key: key                          # 字段键：AccessKey ID
    label: AccessKey ID               # 显示标签
    type: text                        # 控件：单行文本
    required: true
    env: Ali_Key                      # → 环境变量
  - key: secret                       # 字段键：AccessKey Secret
    label: AccessKey Secret           # 显示标签
    type: password                    # 控件：掩码
    required: true
    secret: true
    env: Ali_Secret

status:                               # 自动记录（只读）
  - key: hookInstalled
    label: hook 可用
    note: acme.sh 是否带 dns_ali

example:                              # 凭证示例（掩码）
  name: aliyun-main
  fields: { key: "LTAI••••", secret: "••••••••" }
