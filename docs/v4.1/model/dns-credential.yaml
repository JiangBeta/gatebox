# ─────────────────────────────────────────────────────────────────────────────
# 对象：DNS 凭证（供应商 + 字段）
# 结构：源字段（可编辑，平铺）+ status（自动记录，只读，默认折叠）
# 归属：域名。字段随供应商动态（来自扩展注册表 DNSProviders）。
# 加密存储，不回传明文。参考：docs/v4/L1-03-schema.md §6 · model.DNSCredential
# ─────────────────────────────────────────────────────────────────────────────

kind: dns-credential                  # 对象类型标识（factKind）
title: DNS 凭证                        # 显示名
group: 域名                            # 归属一级页面
list: true                            # 多实例
uiHint: dns-credential                # 前端定制：按供应商动态渲染字段

schema:                               # 源字段（可编辑）
  - key: name                         # 字段键：名称
    label: 名称                        # 显示标签
    type: text                        # 控件：单行文本
    required: true                    # 必填
    placeholder: dnspod-main          # 输入提示
  - key: provider                     # 字段键：供应商
    label: 供应商                      # 显示标签
    type: select                      # 控件：下拉（选项来自供应商模型）
    required: true                    # 必填
    description: 选项来自扩展注册表（内置 + dns-provider 插件）
  - key: fields                       # 字段键：凭证字段
    label: 凭证字段                    # 显示标签
    type: object                      # 控件：对象（随供应商变化）
    required: true                    # 必填
    description: 键集随供应商变化（cloudflare 单 token；dnspod id + token；aliyun accessKeyId + accessKeySecret）

# 自动记录 status（只读，YAML 默认折叠）
status:
  - key: verified                     # 结构 / 供应商校验是否通过
    label: 已校验
    note: 由 POST /credentials/verify（或供应商 API）得出
  - key: lastVerifiedAt               # 最近校验时间
    label: 最近校验
    note: 校验通过的时间

example:                              # 模拟数据基础（明文仅示例，实际加密）
  - name: dnspod-main                 # 名称
    provider: dnspod                  # 腾讯 DNSPod
    fields:                           # 供应商字段
      id: "12345"                     # DNSPod 的 ID（脱敏示例）
      token: "••••••••"               # API Token（掩码）
    status: { verified: true, lastVerifiedAt: 2026-09-20T10:00:00Z }
  - name: cf-main                     # 名称
    provider: cloudflare              # Cloudflare
    fields:                           # 供应商字段
      token: "••••••••"               # API Token（掩码）
    status: { verified: true, lastVerifiedAt: 2026-09-20T10:00:00Z }
