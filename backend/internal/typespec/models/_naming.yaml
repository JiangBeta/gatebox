# ─────────────────────────────────────────────────────────────────────────────
# V4.1 对象模型 · 命名映射与推进约定
# 状态：批次 4 实施中 · 草案
# 依据：docs/v4.1/views.md（为准）· docs/adr/ADR-042.md §13
# 本轮实施裁定：docs/adr/ADR-043.md（类型目录时机 / 路由后端归属 / 生效链 / 旧数据迁移 / 前端骨架）
# ─────────────────────────────────────────────────────────────────────────────

conventions:                                    # 全局约定
  分层: "项目 → 服务 → 路由（views.md §5）"       # 三层对象：项目含服务，服务含路由
  服务: "编排中的一项（一个容器 / compose 的一个 service）；可发布多个端口 → 含多条路由"   # 服务的定义
  路由: "一个转发，后端为 1 个端口；含 域名 / 入口点+端口 / 中间件 / TLS / 类型 / 后端"    # 路由的定义
  根域名: "Domain 对象（一行一个）"                # 根域名是独立对象
  二级域名: "不建实体，内联在路由 / 服务的域名行"    # 二级域名内联，不单独建表
  字段类型: "复用前端 ConfigField（text/password/number/select/switch/textarea/array/object/reference）"   # 字段类型集合
  原型: "静态 HTML（docs/v4.1/prototype/）+ data/mock.js，可直接双击打开"   # 原型形态（用户确认：静态）
  能力命名: "名词.动词，如 config.write / process.start / task.trigger"    # 能力 id 命名规则
  # 规范：对象结构统一为两段（spec / status）。源字段可编辑、平铺；自动记录的观测值放入 status 子节点，只读、YAML 默认折叠。
  对象结构: "源字段（可编辑，平铺，默认展开）+ status（自动记录，只读，嵌套，默认折叠）"   # 对齐 ADR-042 不变量 3：spec 由蓝图展开、status 由观测
  status语义: "status 只放观测 / 派生结果（证书状态、在线、校验、安装状态…）；不进表单，不由用户编辑"
  # YAML 四层面（术语固定，避免「YAML」一词歧义）
  yaml层面:
    模型定义: "docs/v4.1/model/*.yaml（设计期类型定义 kind/schema/status/example）；不进产品、不进编辑区"
    对象文本: "抽屉右栏：单条对象的 spec（源字段）；与表单严格等价、可双向编辑"
    交换文件: "整册导出/导入（envelope: kind + revision + items[]）；走导出入口，不进抽屉"
    compose清单: "部署单元的 docker-compose.yaml（标准格式，语义独立）"
  编辑面: "抽屉 YAML 只序列化 spec（源字段）；status（自动记录）不进编辑面，另设只读「观测」区"
  嵌套源字段: "白名单：backend（服务后端）/ config（中间件参数）；其余源字段一律平铺"
  引用: "对象间引用以 keyField（通常 name）为稳定键；重命名须级联更新引用，删除须引用检查"
  对象id: "每对象有稳定 id（创建时生成，不可变）；引用底层存 id，展示用 keyField；重命名不改引用"
  交换文件: "envelope: kind + revision + items[]；items 内为各对象 spec，引用用 id"
  托管: "status.source = manual | docker；docker 派生对象为托管态，手动编辑前需「接管」（blueprint §5）"
  # 路由后端归属（裁定 A2，2026-09-27）：路由自持目标地址，是自足对象
  路由后端: "route.backend = {host, port}，随路由保存；route.service 为可选引用，仅用于后端列第二行展示与健康关联。L4 转发/固定响应等类型无上游服务时 service 留空"
  # 日志规范
  日志视图: "地图视图（触发卡 → sequence 卡，可缩放/拖动画布）/ 文本视图（CodeEditor + 日志格式高亮）；展示最后一份日志"
  序列模板: "步骤序列由组件自述声明（sequence: no/step/marker/optional）；运行时按 marker 匹配真实日志 → 实际步骤，未命中 optional 记跳过；不同流程用不同模板"
  # 类型目录（裁定 C + A，2026-09-27）：go:embed 编译进二进制，启动解析入内存，只读
  类型目录: "model/catalog.yaml 经 go:embed 嵌入；启动解析进内存只读，本轮无写接口；在线增删留批次 2"
  类型目录最小集: "本轮只装 caddy 内置类型（service: reverse_proxy/file_server/redirect/respond；middleware: encode/basic_auth/headers/websocket/rewrite/code；entrypoint: http/https/grpc/websocket）。插件提供的类型在文件里保留但 installed=false，界面置灰 + [安装]，实际安装留批次 2"
  L4命名: "四层转发统一用 l4_proxy（含 network 参数 tcp/udp），不用 tcp_proxy/udp_proxy 两个类型"

renames:                                        # 旧概念 → V4.1 对象映射
  App:                                          # 旧：应用分组
    to: 分组                                     # 新：分组（可选，纯标签）
    note: 可选，纯标签
  Service旧:                                     # 旧：Service（接入 + 后端）
    to: [服务, 路由]                             # 新：拆成服务与路由
    note: 旧 Service = 接入 + 后端，现拆开
  Fragment:                                     # 旧：Caddy 片段
    to: 中间件                                    # 新：中间件
    note: Caddy 片段 → Middleware
  PortBinding:                                  # 旧：端口表
    to: 入口点                                    # 新：入口点
    note: 协议 → 端口（一对多）
  ComposeInstance:                              # 旧：编排实例
    to: 部署                                      # 新：部署单元
    note: 部署单元
  DNSCredential:                                # 旧：DNS 凭证
    to: DNS凭证                                   # 保持，归域名页
  Registry:                                     # 旧：镜像仓库凭证
    to: 仓库凭证                                  # 保持，归部署页
  Domain:                                       # 旧：根域名
    to: 根域名                                    # 保持
  Cert:                                         # 旧：证书
    to: 证书                                      # 派生对象，只读
    note: 派生对象，只读
  CertLog:                                      # 旧：证书日志
    to: 证书日志                                  # 派生对象，只读
    note: 派生对象，只读
  Variable:                                     # 旧：变量
    to: 变量                                      # 保持
  ACMEEmail:                                    # 旧：全局 ACME 邮箱
    to: acme配置.email                            # 降为字段
    note: 是字段，不是独立对象

batches:                                        # 推进批次（依赖拓扑，严格按序）
  # 批次 2 原含「插件 / 组件自述 / 类型目录」三项。类型目录是批次 4（中间件·服务·路由）的前置
  # （三者 type 字段均引用目录），故按裁定 C 提前到批次 4 一并交付；插件与组件自述仍留批次 2。
  - { no: 0, name: 地基, state: done, items: [原型框架, mock数据层, 命名映射] }        # 骨架 + mock + 映射
  - { no: 1, name: 原子对象, state: done, items: [acme配置, caddy全局, 主机, 变量, 入口点, DNS凭证, 仓库凭证, 用户, 能力字典] }   # 无前置的原子对象
  - { no: 2, name: 组件与插件, state: pending, items: [插件, 组件自述, 类型在线增删] }   # 插件部分最后处理（主系统无插件也能运行）
  - { no: 3, name: 域名, state: done, items: [根域名, 域名/证书, DNS供应商] }            # 依赖凭证
  - { no: 4, name: 网关声明, state: doing, items: [类型目录最小集, 中间件, 服务, 路由] }   # 核心声明对象；类型目录随本批交付
  - { no: 5, name: 部署, state: pending, items: [部署单元, 模板] }                       # 部署与应用商店
  - { no: 6, name: 派生对象, state: pending, items: [证书, 容器, 镜像, 网络, 存储卷, 派生服务, 解析记录] }   # 只读派生
  - { no: 7, name: 链与蓝图, state: pending, items: [链, 步骤, 蓝图] }                   # 编排与真相
  - { no: 8, name: 记录与主视图, state: doing, items: [日志地图/文本, RequestRun, 流量链首页, 任务中心] }   # 记录与主视图
  - { no: 9, name: 监控, state: pending, items: [流量, 健康, 证书, 解析] }               # 监控
