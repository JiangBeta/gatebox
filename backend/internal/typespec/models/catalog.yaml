# ─────────────────────────────────────────────────────────────────────────────
# 对象：类型目录 Catalog（所有可用类型的并集，只读）
# 界面据此自适应：类型全部列出，未安装的置灰 + 一键安装。模型里没有写死的类型清单。
# 归属：组件 → 类型目录。参考：ADR-042 §4.1
#
# 交付方式（裁定 C + A，2026-09-27）：
#   本文件经 go:embed 编译进二进制，启动时解析进内存，只读；本轮无写接口。
#   「最小集」= 只装 caddy 内置类型（installed: true）；
#   插件提供的类型在文件里保留但 installed: false，界面置灰 + [安装]，实际安装留批次 2。
#   未来改为在线增删时，本文件即「内置种子」。
# ─────────────────────────────────────────────────────────────────────────────

kind: catalog                         # 对象类型标识（factKind）
title: 类型目录                        # 显示名
group: 组件                            # 归属一级页面
readonly: true                        # 只读：由类型定义求并集，界面不可编辑
singleton: true                       # 单例：全局仅一份目录

schema:                               # 结构说明（非表单字段，此处描述四张表）
  - key: service_types                # 服务类型表
    label: 服务类型
    note: 驱动 service.type 下拉；含完整 fields 定义，表单据此追加参数
  - key: middleware_types             # 中间件类型表
    label: 中间件类型
    note: 驱动 middleware.type 下拉；含完整 fields 定义
  - key: entrypoint_protocols         # 入口协议表
    label: 入口协议
    note: 驱动 entrypoint 「新增」与 route.entrypoint 引用
  - key: abilities                    # 能力表
    label: 能力
    note: 见 model/ability.yaml

# ── 服务类型 ──────────────────────────────────────────────────────────────────
service_types:
  - id: reverse_proxy
    label: 反向代理
    from: caddy
    installed: true
    description: 把请求转发到上游地址（由 route.backend 给出）
    fields:
      - { key: upstreamProto, label: 后端协议, type: select, default: http, advanced: true,
          options: [ { label: HTTP, value: http }, { label: HTTPS, value: https } ] }
      - { key: healthUri, label: 健康检查, type: text, advanced: true, placeholder: / }
  - id: file_server
    label: 静态文件
    from: caddy
    installed: true
    description: 直接返回目录下的文件
    fields:
      - { key: root,   label: 静态根目录, type: text, required: true, placeholder: /var/www }
      - { key: browse, label: 浏览目录,   type: switch, default: false }
  - id: redirect
    label: 重定向
    from: caddy
    installed: true
    description: 把请求 301/302 重定向到目标地址
    fields:
      - { key: to,     label: 目标地址, type: text, required: true }
      - { key: status, label: 状态码,   type: select, default: '301',
          options: [ { label: 301 永久, value: '301' }, { label: 302 临时, value: '302' } ] }
  - id: respond
    label: 固定响应
    from: caddy
    installed: true
    description: 直接返回固定状态码与内容
    fields:
      - { key: status, label: 状态码,   type: number, default: 200 }
      - { key: body,   label: 响应内容, type: textarea }
  - id: l4_proxy                      # 四层转发（TCP/UDP 合一，用 network 参数区分）
    label: 四层转发
    from: caddy-l4
    installed: false                  # 需 caddy-l4 插件，留批次 2 安装
    description: L4 层的 TCP / UDP 转发（caddy-l4）
    fields:
      - { key: network, label: 传输网络, type: select, default: tcp,
          options: [ { label: TCP, value: tcp }, { label: UDP, value: udp } ] }

# ── 中间件类型 ────────────────────────────────────────────────────────────────
middleware_types:
  - id: encode
    label: 压缩
    from: caddy
    installed: true
    description: 对响应启用 gzip / zstd 压缩
    fields:
      - { key: formats,   label: 压缩格式, type: array, placeholder: gzip, zstd }
      - { key: minLength, label: 最小长度, type: number, advanced: true }
  - id: basic_auth
    label: 基础认证
    from: caddy
    installed: true
    description: HTTP 基础认证；账户引用「设置 · 用户」
    fields:
      - { key: users, label: 用户, type: array, reference: { types: [user] }, required: true, full: true,
          description: 勾选「设置 · 用户」中的账户；渲染 Caddyfile 时解析为 bcrypt 账户（密码不回显） }
  - id: headers
    label: 响应头
    from: caddy
    installed: true
    description: 增删改响应头
    fields:
      - { key: set,    label: 设置,   type: array, placeholder: X-Frame-Options=DENY }
      - { key: delete, label: 删除,   type: array, advanced: true }
  - id: websocket
    label: WebSocket
    from: caddy
    installed: true
    description: WebSocket 升级透传
    fields: []
  - id: rewrite
    label: 重写
    from: caddy
    installed: true
    description: 改写 URI / 响应体
    fields:
      - { key: uri,    label: URI 规则,   type: text, advanced: true, placeholder: /old /new }
      - key: body
        label: 响应体
        type: object
        full: true
        advanced: true
        description: 响应体改写规则（regexp / replace）
        fields:
          - { key: method, label: 方式, type: select, default: replace,
              options: [ { label: 替换, value: replace }, { label: 正则, value: regexp } ] }
          - { key: from,   label: 来源, type: text }
          - { key: to,     label: 目标, type: text }
  - id: code
    label: 自由片段
    from: caddy
    installed: true
    description: 直接写 Caddy 片段体（逃生舱；用户自建中间件固定为此类型）
    fields: []

# ── 入口协议 ──────────────────────────────────────────────────────────────────
entrypoint_protocols:
  - { id: http,      label: HTTP,      from: caddy,     installed: true,  builtin: true }
  - { id: https,     label: HTTPS,     from: caddy,     installed: true,  builtin: true }
  - { id: grpc,      label: gRPC,      from: caddy,     installed: true,  builtin: true }
  - { id: websocket, label: WebSocket, from: caddy,     installed: true,  builtin: true }
  - { id: php,       label: PHP,       from: frankenphp, installed: false }   # Caddy 无内置 PHP 处理器，PHP 运行时来自插件
  - { id: tcp,       label: TCP,       from: caddy-l4,  installed: false }
  - { id: udp,       label: UDP,       from: caddy-l4,  installed: false }
  - { id: mysql,     label: MySQL,     from: caddy-l4,  installed: false }
  - { id: ssh,       label: SSH,       from: caddy-ssh, installed: false }

# ── 能力 ──────────────────────────────────────────────────────────────────────
abilities:                          # 见 model/ability.yaml
  - { id: config.write,    from: [caddy, docker, ddns-go, acme.sh, 核心] }
  - { id: config.reload,   from: [caddy, ddns-go] }
  - { id: process.start,   from: [docker] }
  - { id: task.trigger,    from: [acme.sh, ddns-go] }
  - { id: state.read,      from: [caddy, docker] }
  - { id: logs.read,       from: [caddy, docker, acme.sh, ddns-go] }
  - { id: config.compile,  from: [核心] }
  - { id: object.derive,   from: [核心] }
  - { id: state.diff,      from: [核心] }
