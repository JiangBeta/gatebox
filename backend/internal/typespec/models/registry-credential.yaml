# ─────────────────────────────────────────────────────────────────────────────
# 对象：仓库凭证 Registry（私有镜像仓库）
# 结构：源字段（可编辑，平铺）+ status（自动记录，只读，默认折叠）
# 归属：部署。AES-GCM 加密存储；不回传明文，仅回传 hasSecret。
# 参考：model.Registry
# ─────────────────────────────────────────────────────────────────────────────

kind: registry-credential             # 对象类型标识（factKind）
title: 仓库凭证                        # 显示名
group: 部署                            # 归属一级页面
list: true                            # 多实例

schema:                               # 源字段（可编辑）
  - key: name                         # 字段键：名称
    label: 名称                        # 显示标签
    type: text                        # 控件：文本框
    required: true                    # 必填
    placeholder: ghcr                 # 输入提示
  - key: url                          # 字段键：仓库地址
    label: 仓库地址                    # 显示标签
    type: text                        # 控件：文本框
    required: true                    # 必填
    placeholder: registry.example.com # 输入提示
  - key: scheme                       # 字段键：协议
    label: 协议                        # 显示标签
    type: select                      # 控件：下拉
    default: https                    # 默认 https
    options:                          # 下拉选项
      - { label: HTTPS, value: https }   # 默认
      - { label: HTTP, value: http }     # 内网明文
  - key: username                     # 字段键：用户名
    label: 用户名                      # 显示标签
    type: text                        # 控件：文本框
    required: false                   # 非必填
  - key: secret                       # 字段键：密码 / Token
    label: 密码 / Token                # 显示标签
    type: password                    # 控件：密码框（掩码）
    required: false                   # 非必填
    description: 加密存储，编辑时留空表示不修改

# 自动记录 status（只读，YAML 默认折叠）
status:
  - key: verified                     # 登录 / 拉取校验是否通过
    label: 已校验
    note: 由仓库 API 校验得出
  - key: lastVerifiedAt               # 最近校验时间
    label: 最近校验
    note: 校验通过的时间

example:                              # 模拟数据基础
  - name: ghcr                        # 名称
    url: ghcr.io                      # GitHub 容器仓库
    scheme: https                     # 使用 HTTPS
    username: JiangBeta               # 用户名
    secret: "••••••••"                # Token（掩码）
    status: { verified: true, lastVerifiedAt: 2026-09-18T10:00:00Z }
